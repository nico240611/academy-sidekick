<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>English Classroom | Plataforma Académica 2026-2</title>
<meta name="description" content="Plataforma académica del curso de inglés: cronograma, fechas importantes, boletín de notas y panel docente." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-mark">EC</div>
      <div>
        <h1>English Classroom</h1>
        <p>Plataforma Académica · Segundo Semestre 2026</p>
      </div>
    </div>
    <form id="loginForm" autocomplete="on">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" required autocomplete="username" placeholder="Ingresa tu usuario" />
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Ingresa tu contraseña" />
      <label class="checkline"><input id="remember" type="checkbox" checked /> Mantener sesión iniciada en este dispositivo</label>
      <p id="loginError" class="login-error" role="alert" hidden>Usuario o contraseña incorrectos.</p>
      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>
    <p class="login-foot">Acceso restringido. Si olvidaste tus datos, solicítalos al docente.</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo-mark">EC</div>
      <div class="sidebar-brand-text">
        <strong>English Classroom</strong>
        <span>2026-2</span>
      </div>
    </div>
    <nav class="nav" aria-label="Navegación principal">
      <button class="nav-item is-active" data-view="dashboard"><span class="ico">◧</span> Dashboard</button>
      <button class="nav-item" data-view="cronograma"><span class="ico">▤</span> Cronograma</button>
      <button class="nav-item" data-view="eventos"><span class="ico">◈</span> Fechas importantes</button>
      <button class="nav-item" data-view="notas"><span class="ico">✎</span> Notas por tema</button>
      <button class="nav-item" data-view="avisos"><span class="ico">✉</span> Avisos y chat</button>
      <button class="nav-item teacher-only" data-view="docente" hidden><span class="ico">⚙</span> Panel docente</button>
      <button class="nav-item teacher-only" data-view="config" hidden><span class="ico">☰</span> Configuración</button>
    </nav>
    <div class="sidebar-foot">
      <a class="meet-link" id="sideMeet" href="#" target="_blank" rel="noopener">Entrar a Google Meet</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Abrir menú">☰</button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-user">
        <div class="user-meta">
          <strong id="userName">—</strong>
          <span class="role-chip" id="userRole">—</span>
        </div>
        <button class="btn btn-ghost" id="logoutBtn">Cerrar sesión</button>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  (function () {
    var SUPABASE_URL = "https://lrkmwsabjxnbvfcxvdxz.supabase.co";
    var SUPABASE_KEY = "sb_publishable_kJpjge20B-Vc9skk3uSQkw_Ntv6l4Mj";
    function createSupabaseFetch(key) {
      return function (input, init) {
        var headers = new Headers(init && init.headers);
        if (key.indexOf("sb_") === 0 && headers.get("Authorization") === "Bearer " + key) {
          headers.delete("Authorization");
        }
        headers.set("apikey", key);
        return fetch(input, Object.assign({}, init, { headers: headers }));
      };
    }
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      global: { fetch: createSupabaseFetch(SUPABASE_KEY) },
      auth: { persistSession: true, storage: localStorage, autoRefreshToken: true }
    });
  })();
</script>
<script src="script.js"></script>
</body>
</html>
